services:

  postgres:
    image: postgres:16
    container_name: api_postgres
    environment:
      POSTGRES_DB: api_hexagonal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api_spring
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_hexagonal
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data: